<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirebound — Card Combat</title>
<style>
:root{color-scheme:dark;--text:#edf2f7;--muted:#aab7c6;--line:#536477;--gold:#f3c969}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 25%,#354253,#202b39 44%,#111821);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}.game{width:min(1080px,100%);min-height:100vh;margin:auto;padding:16px 22px 22px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:#17212ddd;box-shadow:0 12px 30px #0004}.brand{color:var(--gold);font-size:.9rem;font-weight:900;letter-spacing:.14em}.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.stat{padding:7px 10px;border-radius:8px;background:#ffffff0b;font-size:.9rem;font-weight:750}.turn{color:var(--muted);font-size:.82rem;white-space:nowrap}.arena{position:relative;flex:1;min-height:325px;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:25px 4%;gap:20px}.arena:before{content:"";position:absolute;left:50%;top:15%;bottom:15%;width:1px;background:linear-gradient(transparent,#8290a244,transparent)}.fighter{z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center}.avatar{width:135px;height:135px;display:grid;place-items:center;border:2px solid #728096;border-radius:27px;background:linear-gradient(145deg,#47576b,#202c3b);box-shadow:0 18px 35px #0005;font-size:5rem;transition:transform .18s}.enemy .avatar{border-color:#b77871;background:linear-gradient(145deg,#684b50,#302a36)}.avatar.hit{animation:hit .28s}@keyframes hit{50%{transform:translateX(9px) rotate(3deg);filter:brightness(1.7)}}.name{margin:11px 0 6px;font-weight:900;letter-spacing:.05em}.health{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.83rem}.track{width:145px;height:10px;overflow:hidden;border-radius:8px;background:#080d14}.fill{height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,#d9515c,#ff8175);transition:width .25s}.player .fill{background:linear-gradient(90deg,#3fae7a,#83d89c)}.tags{display:flex;gap:6px;min-height:27px;margin-top:8px;flex-wrap:wrap;justify-content:center}.tag{padding:3px 8px;border:1px solid #77869a;border-radius:20px;background:#131d29;color:#dce5ef;font-size:.73rem;font-weight:700}.tag.block{color:#a9dcff;border-color:#4c98c5}.tag.vuln{color:#ffc078;border-color:#c17b44}.intent{display:flex;align-items:center;gap:7px;margin-top:8px;padding:6px 10px;border:1px solid #be775c;border-radius:9px;color:#ffd2b8;background:#381f20;font-size:.8rem;font-weight:800}.message{min-height:43px;margin:0 0 11px;padding:10px 14px;border:1px solid #4b5c70;border-radius:9px;background:#111a25bd;color:#d6e0ea;text-align:center;font-size:.88rem}.bottom{padding:14px;border:1px solid var(--line);border-radius:15px;background:#17212df2;box-shadow:0 15px 35px #0004}.bottom-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.piles{display:flex;gap:7px}.pile{padding:6px 9px;border-radius:7px;background:#263547;font-size:.76rem;font-weight:750}.pile b{color:var(--gold)}.hand-label{color:#bdc9d6;font-size:.82rem;font-weight:850;letter-spacing:.1em;text-transform:uppercase}.end{padding:9px 15px;border:1px solid #d59b48;border-radius:8px;color:#20170d;background:linear-gradient(#f5cc75,#e5a84c);font-weight:900;cursor:pointer;transition:transform .15s,filter .15s}.end:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}button:disabled{opacity:.5;cursor:not-allowed}.hand{display:flex;justify-content:center;align-items:stretch;gap:11px;min-height:174px}.card{position:relative;width:min(150px,19%);min-width:105px;min-height:164px;padding:11px 9px;border:2px solid #aeb8c5;border-radius:11px;color:#19212c;background:linear-gradient(155deg,#f3f0e5,#d8dce2);box-shadow:0 7px 13px #0005;text-align:left;cursor:pointer;transition:transform .16s,box-shadow .16s,filter .16s}.card.attack{border-color:#e78378;background:linear-gradient(155deg,#fff0e7,#e8c1b6)}.card.skill{border-color:#73b3de;background:linear-gradient(155deg,#e8f7ff,#b9d8e9)}.card:hover:not(:disabled){z-index:2;transform:translateY(-11px) scale(1.03);box-shadow:0 15px 24px #0008}.card:active:not(:disabled){transform:translateY(-3px) scale(.99)}.card:disabled{filter:grayscale(.4) brightness(.78)}.cost{position:absolute;top:-8px;left:-8px;width:28px;height:28px;display:grid;place-items:center;border:2px solid white;border-radius:50%;color:white;background:#4289bb;font-weight:900}.card-name{display:block;margin:2px 0 7px 15px;font-size:.88rem;font-weight:900}.art{height:56px;display:grid;place-items:center;margin-bottom:7px;border-radius:7px;background:#33475b18;font-size:2.3rem}.description{display:block;color:#303b48;font-size:.74rem;line-height:1.35}.empty{align-self:center;color:var(--muted)}.overlay{position:fixed;z-index:4;inset:0;display:grid;place-items:center;padding:20px;background:#070b11dc;backdrop-filter:blur(5px)}.overlay[hidden]{display:none}.result{width:min(420px,100%);padding:30px 24px;border:1px solid #7d8ca0;border-radius:17px;background:linear-gradient(145deg,#2c3949,#18212d);box-shadow:0 25px 70px #0009;text-align:center}.result-icon{font-size:4rem}.result h1{margin:5px;color:var(--gold);font-size:2rem}.result p{color:#c3cedb}.restart{margin-top:12px;padding:10px 18px;border:0;border-radius:8px;color:#142019;background:#81d6a5;font-weight:900;cursor:pointer}.restart:hover{filter:brightness(1.1)}@media(max-width:650px){.game{padding:9px}.top{flex-wrap:wrap;justify-content:center;padding:10px}.brand,.turn{width:100%;text-align:center}.arena{min-height:285px;padding:20px 0;gap:4px}.avatar{width:102px;height:102px;border-radius:20px;font-size:3.8rem}.track{width:100px}.bottom{padding:11px 8px}.bottom-head{flex-wrap:wrap}.hand-label{order:-1;width:100%;text-align:center}.hand{justify-content:flex-start;overflow-x:auto;padding:7px 4px 12px;min-height:160px}.card{flex:0 0 124px;width:124px;min-width:124px;min-height:150px}.art{height:44px}.piles{gap:4px}.pile{padding:6px;font-size:.68rem}.end{padding:8px 10px}}
</style>
</head>
<body>
<main class="game">
	<header class="top"><div class="brand">⚔ SPIREBOUND</div><div class="stats"><div class="stat">❤️ <strong id="hp-top"></strong></div><div class="stat">🛡️ <strong id="block-top">0</strong></div><div class="stat">🪙 <strong id="gold">99</strong></div><div class="stat">⚡ <strong id="energy"></strong></div></div><div class="turn" id="turn"></div></header>
	<section class="arena" aria-label="Combat arena">
		<div class="fighter player"><div class="avatar" id="hero-avatar" aria-label="Hero">🧙</div><div class="name">THE WAYFARER</div><div class="health"><span>HP</span><div class="track"><div class="fill" id="hero-fill"></div></div><strong id="hero-hp"></strong></div><div class="tags" id="hero-tags"></div></div>
		<div class="fighter enemy"><div class="avatar" id="foe-avatar" aria-label="Enemy">👹</div><div class="name">SPIRE SENTINEL</div><div class="health"><span>HP</span><div class="track"><div class="fill" id="foe-fill"></div></div><strong id="foe-hp"></strong></div><div class="tags" id="foe-tags"></div><div class="intent"><span id="intent-icon">⚔️</span><span id="intent-text"></span></div></div>
	</section>
	<div class="message" id="message" aria-live="polite"></div>
	<section class="bottom" aria-label="Your cards"><div class="bottom-head"><div class="piles"><div class="pile">📚 Draw <b id="draw-count">0</b></div><div class="pile">🗑 Discard <b id="discard-count">0</b></div></div><div class="hand-label">Your hand</div><button class="end" id="end-turn">End turn ↗</button></div><div class="hand" id="hand"></div></section>
</main>
<div class="overlay" id="overlay" hidden><div class="result"><div class="result-icon" id="result-icon">🏆</div><h1 id="result-title">Victory!</h1><p id="result-copy"></p><button class="restart" id="restart">↻ Restart combat</button></div></div>
<script>
(()=>{
	const $=id=>document.getElementById(id);
	const cardInfo={Strike:{cost:1,type:"attack",icon:"⚔️",text:"Deal 6 damage."},Defend:{cost:1,type:"skill",icon:"🛡️",text:"Gain 5 Block."},Bash:{cost:2,type:"attack",icon:"💥",text:"Deal 8 damage. Apply 1 Vulnerable."}};
	let game;
	const makeCard=name=>({name,key:Math.random().toString(36).slice(2)});
	function shuffle(cards){for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}return cards}
	function nextIntent(){return Math.random()<.68?{type:"attack",value:8+Math.floor(Math.random()*4)}:{type:"defend",value:5+Math.floor(Math.random()*3)}}
	function note(text){$("message").textContent=text}
	function reset(){game={player:{hp:70,max:70,block:0,vulnerable:0},enemy:{hp:54,max:54,block:0,vulnerable:0},gold:99,energy:3,maxEnergy:3,turn:1,active:true,draw:shuffle(["Strike","Strike","Strike","Strike","Strike","Defend","Defend","Defend","Defend","Bash"].map(makeCard)),hand:[],discard:[],intent:nextIntent()};$("overlay").hidden=true;note("A Sentinel blocks the path. Choose your cards wisely.");startTurn()}
	function draw(){if(!game.draw.length&&game.discard.length){game.draw=shuffle(game.discard.splice(0));note("Your discard pile is shuffled back into the draw pile.")}if(game.draw.length)game.hand.push(game.draw.pop())}
	function startTurn(){if(!game.active)return;game.player.block=0;game.energy=game.maxEnergy;for(let i=0;i<5;i++)draw();note(`Turn ${game.turn}: you have 3 Energy. Play a card or end your turn.`);render()}
	function damage(target,amount){const blocked=Math.min(target.block,amount);target.block-=blocked;const dealt=amount-blocked;target.hp=Math.max(0,target.hp-dealt);return{blocked,dealt}}
	function flash(id){const el=$(id);el.classList.remove("hit");void el.offsetWidth;el.classList.add("hit")}
	function play(key){if(!game.active)return;const index=game.hand.findIndex(c=>c.key===key);if(index<0)return;const card=game.hand[index],data=cardInfo[card.name];if(game.energy<data.cost){note(`Not enough Energy to play ${card.name}.`);return}game.energy-=data.cost;game.hand.splice(index,1);game.discard.push(card);if(card.name==="Defend"){game.player.block+=5;note("You brace yourself and gain 5 Block.")}else{if(card.name==="Bash")game.enemy.vulnerable=Math.max(game.enemy.vulnerable,2);const base=card.name==="Bash"?8:6,amount=game.enemy.vulnerable?Math.floor(base*1.5):base,result=damage(game.enemy,amount);flash("foe-avatar");note(`${card.name} deals ${result.dealt} damage${result.blocked?` (${result.blocked} absorbed by Block)`:""}${card.name==="Bash"?" and applies Vulnerable.":"."}`);if(game.enemy.hp===0){game.gold+=25;finish(true)}}render()}
	function endTurn(){if(!game.active)return;game.enemy.block=0;const intent=game.intent;if(intent.type==="attack"){let amount=intent.value;if(game.player.vulnerable)amount=Math.floor(amount*1.5);const result=damage(game.player,amount);flash("hero-avatar");note(`The Sentinel attacks for ${amount}${result.blocked?`; your Block absorbs ${result.blocked}`:""}.`)}else{game.enemy.block=intent.value;note(`The Sentinel braces and gains ${intent.value} Block.`)}if(game.player.hp===0){finish(false);render();return}if(game.enemy.vulnerable)game.enemy.vulnerable--;if(game.player.vulnerable)game.player.vulnerable--;game.discard.push(...game.hand.splice(0));game.intent=nextIntent();game.turn++;startTurn()}
	function finish(won){game.active=false;$("overlay").hidden=false;$("result-icon").textContent=won?"🏆":"💀";$("result-title").textContent=won?"Victory!":"Defeat";$("result-copy").textContent=won?"The Sentinel falls, and you collect 25 gold. The spire awaits.":"Your journey ends here. Gather your strength and try again."}
	function tag(parent,text,kind){const el=document.createElement("span");el.className=`tag ${kind||""}`;el.textContent=text;parent.append(el)}
	function render(){const p=game.player,e=game.enemy;$("hp-top").textContent=`${p.hp} / ${p.maxHp}`;$("hero-hp").textContent=`${p.hp} / ${p.maxHp}`;$("hero-fill").style.width=`${100*p.hp/p.maxHp}%`;$("foe-hp").textContent=`${e.hp} / ${e.maxHp}`;$("foe-fill").style.width=`${100*e.hp/e.maxHp}%`;$("block-top").textContent=p.block;$("gold").textContent=game.gold;$("energy").textContent=`${game.energy} / ${game.maxEnergy}`;$("turn").textContent=`Your turn · ${game.turn}`;$("draw-count").textContent=game.draw.length;$("discard-count").textContent=game.discard.length;$("intent-icon").textContent=game.intent.type==="attack"?"⚔️":"🛡️";$("intent-text").textContent=game.intent.type==="attack"?`Attacking for ${game.intent.value}`:`Defending for ${game.intent.value}`;const pt=$("hero-tags"),et=$("foe-tags");pt.replaceChildren();et.replaceChildren();if(p.block)tag(pt,`🛡 ${p.block} Block`,"block");if(p.vulnerable)tag(pt,`🔥 Vulnerable · ${p.vulnerable}`,"vuln");if(e.block)tag(et,`🛡 ${e.block} Block`,"block");if(e.vulnerable)tag(et,`🔥 Vulnerable · ${e.vulnerable}`,"vuln");const hand=$("hand");hand.replaceChildren();if(!game.hand.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="No cards in hand";hand.append(empty)}for(const card of game.hand){const data=cardInfo[card.name],button=document.createElement("button");button.type="button";button.className=`card ${data.type}`;button.disabled=!game.active||game.energy<data.cost;button.setAttribute("aria-label",`${card.name}, costs ${data.cost} Energy. ${data.text}`);button.innerHTML=`<span class="cost">${data.cost}</span><span class="card-name">${card.name}</span><span class="art">${data.icon}</span><span class="description">${data.text}</span>`;button.addEventListener("click",()=>play(card.key));hand.append(button)}$("end-turn").disabled=!game.active}
	$("end-turn").addEventListener("click",endTurn);$("restart").addEventListener("click",reset);reset();
})();
</script>
</body>
</html>
